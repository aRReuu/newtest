name: iOS 16.7 STT SDK typecheck (isolated)

on:
  push:
    branches:
      - main
    paths:
      - aReuImpress-iPhone/Utils/Public/ImSpeech/ImpressSpeechService.swift
      - .github/workflows/ios16-stt-sdk-typecheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech-sdk-typecheck:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: SDK typecheck one dual-engine Swift source (no Pods, no app build)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cat > "$RUNNER_TEMP/ImpressV3LStub.swift" <<'SWIFT'
          import Foundation
          func V3L(_ value: String) -> String { value }
          SWIFT
          xcrun swiftc -typecheck -swift-version 5 \
            -target arm64-apple-ios16.7 -sdk "$SDK" \
            "$RUNNER_TEMP/ImpressV3LStub.swift" \
            aReuImpress-iPhone/Utils/Public/ImSpeech/ImpressSpeechService.swift
