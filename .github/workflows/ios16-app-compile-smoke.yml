name: Impress iOS 16.7 no-signing app compilation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios16-app-compile-smoke.yml
      - aReuImpress-iPhone/DataBase/V3/**
      - aReuImpress-iPhone/VC/SubVCs/ImWebVC/**
      - aReuImpress-iPhone/VC/SubVCs/ImNoteListVC/**
      - aReuImpress-iPhone/VC/MainVCs/ImCardVC/**
      - aReuImpress-iPhone/Utils/Public/ImFileManager/**
      - aReuImpress-iPhone/Utils/Public/ImSpeech/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show selected Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Recreate omitted empty CocoaPods resource wrapper for public mirror
        shell: bash
        run: |
          set -euo pipefail
          # The public sanitized repo omits this binary resource wrapper.
          # This is a compile-only placeholder, not a replacement for a full IPA.
          mkdir -p Pods/IQKeyboardManagerSwift/IQKeyboardManagerSwift/Resources/IQKeyboardManager.bundle
          cat > Pods/IQKeyboardManagerSwift/IQKeyboardManagerSwift/Resources/IQKeyboardManager.bundle/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.areu.impress.ci.iqkeyboard-placeholder</string></dict></plist>
          PLIST
      - name: Force vendored CocoaPods build settings to the app's iOS 16.7 floor
        shell: bash
        run: |
          set -euo pipefail
          # Checked-in Pods project predates the target-floor change; macOS
          # Xcode 26 cannot link its historic iOS 8/9 libarclite targets.
          # Apply this CI-only setting without running pod install/update.
          ruby -pi -e 'gsub(/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/, "IPHONEOS_DEPLOYMENT_TARGET = 16.7;")' \
            Pods/Pods.xcodeproj/project.pbxproj
      - name: Resolve pinned Swift packages (never run CocoaPods install/update)
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace aReuImpress-iPhone.xcworkspace \
            -scheme aReuImpress-iPhone \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ImpressSPM"
      - name: Compile entire iOS app, without signing or XCTest
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace aReuImpress-iPhone.xcworkspace \
            -scheme aReuImpress-iPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ImpressSPM" \
            -derivedDataPath "$RUNNER_TEMP/ImpressBuild" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E 'error:|fatal error:|BUILD FAILED' "$RUNNER_TEMP/build.log" | tail -100 || true
              tail -140 "$RUNNER_TEMP/build.log"
              exit 1
            }
          grep -E '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"
