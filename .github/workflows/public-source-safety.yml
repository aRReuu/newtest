name: Public sanitized source safety
on:
  push:
    branches:
      - main
      - staging/english-source-mirror-20261105
  pull_request:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify no images, icons, private data or Chinese explanatory prose
        run: python3 .github/scripts/check_public_mirror.py
      - name: DeepSeek React DOM bridge unit checks (offline)
        run: node .github/scripts/test_deepseek_bridge.js
      - name: November 2026 route and privacy checks (static)
        run: python3 .github/scripts/check_november_features.py
      - name: Calibration drawer and navigation contract (static)
        run: python3 .github/scripts/test_calibration_drawer_contract.py
      - name: iOS 16.7 floor, legacy API, offline STT and consented translation
        run: |
          python3 .github/scripts/verify_ios26_floor.py
          python3 .github/scripts/verify_apple_stt_contract.py
          python3 .github/scripts/test_ios16_feature_routes.py
      - name: Parse changed Swift files only (no build, linking or Pods)
        run: |
          swiftc -frontend -parse \
            aReuImpress-iPhone/Base/AppDelegate.swift \
            aReuImpress-iPhone/Base/ImTabBarViewController.swift \
            aReuImpress-iPhone/Base/SceneDelegate.swift \
            aReuImpress-iPhone/VC/MainVCs/ImCalibrationVC/ImpressCalibrationReminderCoordinator.swift \
            aReuImpress-iPhone/VC/MainVCs/ImCalibrationVC/ImpressCalibrationViewController.swift \
            aReuImpress-iPhone/Utils/Constansts/ImColorConstants.swift \
            aReuImpress-iPhone/Utils/Public/ImSpeech/ImpressSpeechInputUI.swift \
            aReuImpress-iPhone/Utils/Public/ImSpeech/ImpressSpeechService.swift \
            aReuImpress-iPhone/Utils/Public/ImSpeech/ImpressSpeechSettingsViewController.swift \
            ImpressCalibrationWidgets/ImpressCalibrationWidgets.swift \
            aReuImpress-iPhone/VC/SubVCs/ImWebVC/ImWebViewController.swift \
            aReuImpress-iPhone/Utils/Public/ImAI/ImpressAISettingsViewController.swift \
            aReuImpress-iPhone/VC/MainVCs/ImCardVC/ImpressV3CardComposerViewController.swift \
            aReuImpress-iPhone/VC/MainVCs/ImCardVC/ImpressV3ReviewViewController.swift \
            aReuImpress-iPhone/VC/SubVCs/ImNoteListVC/ImMarkdownVC/ImMarkdownViewController.swift \
            aReuImpress-iPhoneTests/V3/ImpressCalibrationIntegrationTests.swift \
            aReuImpress-iPhoneUITests/ImpressV11NavigationUITests.swift
